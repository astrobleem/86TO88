# WM88 bridge - DOSBox-X test fixture (serial-mouse variant used for the
# scripted gameplay evidence in evidence/). The deliverable config
# (deliverable/dosbox-wm88.conf) uses the standard DOSBox mouse instead.
# 1. Build a guest folder: Windows 3.0 installation + your own unmodified
#    WINMINE.EXE in WINDOWS\ + the deliverable installed (INSTALL.BAT).
# 2. Replace <GUEST_DIR> in [autoexec] with that folder's host path.
# 3. Start tools/mousesrv.py (serial mouse on TCP 127.0.0.1:13999), then:
#    dosbox-x -conf emulator/dosbox-wm88-test.conf
# NOTE: cputype=286 is required with DOSBox-X today - its 8086 core hangs
# even a completely stock Windows 3.0. Literal-8088 validation is tracked
# separately; see README.md ("Status").

[sdl]
autolock=false
mouse_emulation=never
fullscreen=false
windowresolution=1024x768
output=surface

[dosbox]
machine=svga_s3
memsizekb=640

[cpu]
core=normal
cputype=286
cycles=fixed 10000

[dos]
xms=false
ems=false
umb=false

[keyboard]
auxdevice=none

[serial]
serial1=nullmodem server:127.0.0.1 port:13999

[autoexec]
@echo off
mount c <GUEST_DIR>
c:
cd WINDOWS
WM88TSR.COM
WIN /R WINMINE.EXE
