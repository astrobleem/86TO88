# WM88 bridge - DOSBox-X fixture config (for trying it on a modern host).
# 1. Create a folder on your host, e.g. C:\wm88guest, containing a full
#    Windows 3.0 installation (WINDOWS\ and WINDOWS\SYSTEM\), your own
#    unmodified WINMINE.EXE in WINDOWS\, and the WM88 deliverable files
#    copied per README.TXT (SHELL.DLL into WINDOWS\SYSTEM\).
# 2. Adjust the mount path in [autoexec] below to that folder.
# 3. Run:  dosbox-x -conf dosbox-wm88.conf
# The normal DOSBox mouse integration gives you a working guest mouse.
# NOTE: cputype=286 is required with DOSBox-X today - its 8086 core hangs
# even a completely stock Windows 3.0. See README.TXT ("CPU honesty").

[sdl]
fullscreen=false
windowresolution=1024x768
output=surface

[dosbox]
machine=svga_s3
memsizekb=640

[cpu]
core=normal
cputype=286
cycles=fixed 10000

[dos]
xms=false
ems=false
umb=false

[autoexec]
@echo off
mount c /path/to/your/wm88guest
c:
cd WINDOWS
WM88TSR.COM
WIN /R WINMINE.EXE
